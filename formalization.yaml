      models: ["Claude Opus 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        This repository's own Lean (the Hadwiger/ directory), the port of the authors'
        files and this metadata were written by an AI coding agent in sessions directed by
        the maintainer. Earlier sessions may have used other Claude models; the session
        logs under docs/ and sessions/ are the record.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "The maintainer's instructions are quoted in docs/SESSION_LOG.md and AGENTS.md."
    - method: "other"
      models: []
      framework: "n/a"
      tool_setup: >-
        The authors' formalisation under OAI/ was produced by OpenAI. This project has no
        information about how beyond what the openai/math repository itself states.
  spend_usd: "not tracked"
  notes: >-
    The maintainer set the goal, chose the definitions' form where a choice was put to him,
    and decided on 2026-10-08 to build on the authors' formalisation instead of completing
    an independent proof. All Lean text and documentation in Hadwiger/ was written by the
    AI agent. No human has read the proofs line by line; correctness of the proofs rests on
    Lean's kernel.

fidelity:
  divergences: >-
    All of form, none known of content. (1) cm(G) < m/100 is stated in the natural numbers
    as 100 cm(G) < m. (2) "Arbitrarily large" is "for every N there is m >= N"; an m-vertex
    graph is a graph on Fin m. (3) In Corollary 1.2 the chromatic number (Mathlib's, with
    values in the extended naturals) is exhibited as a natural number and the chain is
    compared in the reals. (4) Minors are defined by branch sets (disjoint connected vertex
    sets with an edge between adjacent ones), the standard characterisation; its
    equivalence with edge contraction is a textbook fact and is not proved here. (5) The
    Hadwiger number, the connected-matching number and the fractional chromatic number are
    defined as a supremum or infimum, which is attained for finite graphs; every statement
    is about finite graphs. (6) A fractional colouring is a weight function on all vertex
    sets that vanishes off the independent ones. (7) Hadwiger's conjecture is stated for
    finite nonempty graphs whose vertex type lies in the lowest universe; every finite
    graph is isomorphic to one of these, and the counterexamples are on Fin m. (8) The
    quantifier of the fractional weakening, which the manuscript writes as a bare
    inequality, is taken from its statement of the conjecture.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The definitions and the five compared statements were set against the manuscript clause
    by clause in fidelity notes written by the AI agent (blueprint/FIDELITY.md) and were
    accepted by the maintainer on 2026-10-07 through a review sheet the agent had prepared.
    That is the authors' own check and not an independent review. Sanity lemmas pin the
    definitions on small cases (complete graphs, the path on three vertices, the 4-cycle,
    the 5-cycle). The authors' formalisation was audited here only mechanically: it builds
    and uses the three standard axioms. Its proofs and its internal definitions were not
    reviewed by this project.

alignment:
  namespace: "Hadwiger"
  statements:
    - source: "Theorem 1.1"
      lean: "Hadwiger.exists_indepNum_le_two_and_connectedMatchingNumber_lt"
      module: "Hadwiger.Main"
      status: "proved, by the authors' formalisation and a comparison of definitions"
      note: "The proof is OAI.HadwigerCounterexample.exists_counterexamples (not this repository's work) with Hadwiger.connectedMatchingNumber_le_upstream."
    - source: "Corollary 1.2"
      lean: "Hadwiger.exists_hadwigerNumber_lt_fractionalChromaticNumber"
      module: "Hadwiger.Main"
      status: "proved from Theorem 1.1"
      note: "This repository's own deduction, by its own proof of Proposition 3.5 and of the bounds |V| <= alpha chi_f and chi_f <= chi. Includes the fractional chromatic number."
    - source: "Corollary 1.2, consequence; the abstract"
      lean: "Hadwiger.exists_hadwigerNumber_lt_chromaticNumber"
      module: "Hadwiger.Main"
      status: "proved from Corollary 1.2"
      note: "Arbitrarily large finite graphs with h(G) < chi(G)."
    - source: "Corollary 1.2, last sentence"
      lean: "Hadwiger.not_hadwigerConjecture"
      module: "Hadwiger.Main"
      status: "proved from the previous statement"
      note: "Negation of Hadwiger's conjecture for finite nonempty graphs."
    - source: "Corollary 1.2, last sentence"
      lean: "Hadwiger.not_fractionalHadwigerConjecture"
      module: "Hadwiger.Main"
      status: "proved from Corollary 1.2"
      note: "Negation of chi_f(G) <= h(G) for finite nonempty graphs."

acknowledgements: >-
  The proof of the main theorem is the work of the authors of openai/math. Mathlib and Lean
