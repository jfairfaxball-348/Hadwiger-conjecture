name = "hadwiger"
version = "0.1.0"
defaultTargets = ["Hadwiger", "Challenge", "Solution"]

[leanOptions]
autoImplicit = false

# Mathlib is pinned to an exact commit: the one tagged v4.35.0-rc2, whose toolchain is the
# Lean release in `lean-toolchain`. The Palomar registry requires a Lean release no older
# than v4.35.0-rc2 and a Mathlib commit of exactly the same toolchain. (Until 2026-10-08
# the pins were Lean v4.34.1 and Mathlib d13f23b, the pins of openai/math; the tagged
# commit is 69 Mathlib commits later.)
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

[[lean_lib]]
name = "Hadwiger"

# The upstream formalisation of the paper, from openai/math at commit
# fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb (Apache-2.0), copied byte for byte: the import
# closure of OAI.Combinatorics.HadwigerCounterexample.Main, 288 files. See NOTICE.
[[lean_lib]]
name = "OAI"

# The registry's two modules: the statements (Mathlib only, with deliberate `sorry`) and
# the solution (imports the proofs). `comparator.json` names what is compared.
[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
