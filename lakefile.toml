name = "hadwiger"
version = "0.1.0"
defaultTargets = ["Hadwiger"]

[leanOptions]
autoImplicit = false

# Mathlib is pinned to an exact commit. It is the commit that openai/math pinned at
# adc7f12 for Lean v4.34.1, chosen so that statements here can be compared with theirs
# under identical library definitions. Change it only as a deliberate, recorded step.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "Hadwiger"

# The upstream formalisation of the paper, from openai/math at commit
# fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb (Apache-2.0), copied byte for byte: the import
# closure of OAI.Combinatorics.HadwigerCounterexample.Main, 288 files. See NOTICE.
[[lean_lib]]
name = "OAI"
